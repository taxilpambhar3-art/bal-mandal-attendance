name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android-app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/BalMandalAttendance.apk
          echo "APK successfully built at android-app/output/BalMandalAttendance.apk"
          ls -lh output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalMandalAttendance-APK
          path: android-app/output/BalMandalAttendance.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Bal Mandal Attendance App (v1.0.0 APK)"
          body: |
            ### 📱 Bal Mandal Attendance Portal — Official Android APK
            
            Standalone Android `.apk` package for the Bal Mandal Attendance Portal.
            
            - **Biometric Face Recognition Supported** (Camera access granted)
            - **Native Full-Screen** Android experience
            
            #### 📥 Download & Installation:
            1. Download `BalMandalAttendance.apk` below directly to your Android phone.
            2. Open the downloaded file.
            3. Tap **Install** (Allow "Install unknown apps" from your browser/files if prompted).
          files: android-app/output/BalMandalAttendance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
